name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commits (the release named in each comment) so a moved tag cannot change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: No personal data
        run: python dev/check_private_data.py
      - name: Tests (the PDF test runs wherever the runner has Chrome or Edge)
        run: python -m pytest -q
      - name: Benchmark
        run: python benchmark/run_benchmark.py
