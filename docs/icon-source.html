<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>honest-tailor icon source</title>
<!-- Source of .claude-plugin/icon.png: headless Edge, 1024x1024 window. Edit this file, never the PNG. -->
<style>
  html, body { margin: 0; padding: 0; background: #1d3557; }
  svg { display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#1d3557"/>
  <!-- the CV page -->
  <rect x="252" y="150" width="520" height="680" rx="44" fill="#ffffff"/>
  <!-- the tailor's seam: stitching just inside the page edge -->
  <rect x="290" y="188" width="444" height="604" rx="26" fill="none" stroke="#e63946" stroke-width="12"
        stroke-dasharray="34 22" stroke-linecap="round"/>
  <!-- lines of the CV -->
  <rect x="340" y="268" width="250" height="34" rx="17" fill="#1d3557"/>
  <rect x="340" y="350" width="340" height="24" rx="12" fill="#c5cfdc"/>
  <rect x="340" y="404" width="300" height="24" rx="12" fill="#c5cfdc"/>
  <rect x="340" y="458" width="320" height="24" rx="12" fill="#c5cfdc"/>
  <rect x="340" y="512" width="220" height="24" rx="12" fill="#c5cfdc"/>
  <!-- the check: every claim traced -->
  <circle cx="712" cy="742" r="168" fill="#2a9d8f" stroke="#1d3557" stroke-width="20"/>
  <path d="M630 744 L690 804 L800 684" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
</body>
</html>
